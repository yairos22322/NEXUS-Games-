name: Code Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Panda3D runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run project validator
        run: python CHECK_PROJECT.py

      - name: Verify engine imports
        run: python -c "import panda3d, direct, simplepbr; from panda3d.core import Vec3; print('Panda3D runtime import PASS', Vec3(1, 2, 3))"

      - name: Run simulation unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
